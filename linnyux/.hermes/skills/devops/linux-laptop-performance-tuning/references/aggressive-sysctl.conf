# Aggressive sysctl.conf for NVMe laptop (Ubuntu 24.04 tested)

## /etc/sysctl.d/99-zzz-performance-tuning.conf

```
vm.dirty_ratio = 20
vm.dirty_background_ratio = 10
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 500
vm.vfs_cache_pressure = 200
vm.swappiness = 10
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fin_timeout = 15
fs.file-max = 2097152
kernel.sched_min_granularity_ns = 3000000
kernel.sched_wakeup_granularity_ns = 4000000
kernel.sched_migration_cost_ns = 500000
kernel.sched_nr_migrate = 32
vm.zone_reclaim_mode = 0
```

## Verification

```bash
sudo sysctl --system
sysctl vm.dirty_ratio vm.dirty_background_ratio vm.vfs_cache_pressure vm.swappiness net.ipv4.tcp_congestion_control
```

Expected:
- `vm.dirty_ratio = 20`
- `vm.dirty_background_ratio = 10`
- `vm.vfs_cache_pressure = 200`
- `vm.swappiness = 10`
- `net.ipv4.tcp_congestion_control = bbr`

## Rollback

```bash
sudo rm /etc/sysctl.d/99-zzz-performance-tuning.conf && sudo sysctl --system
```
