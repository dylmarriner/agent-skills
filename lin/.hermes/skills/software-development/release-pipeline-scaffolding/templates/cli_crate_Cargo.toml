[package]
name = "<cli_name>"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["<Project> Execution Team"]
description = "<Project> Phase N CLI: <one-line summary>"

[dependencies]
# The two crate deps are the engine-facing surface; the rest are stable tooling
<core_crate> = { path = "<path-to-core>" }
<engine_crate> = { path = "<path-to-engine>" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
hex.workspace = true
blake3.workspace = true
bincode.workspace = true

[[bin]]
name = "<bin_name>"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
